<style>
  :root{
    --bg:#f4efe3; --side:#8a9b82; --side-act:#fff; --head:#9aa890;
    --card:#fbfaf4; --card2:#f1ebdd; --line:#dfe2d3; --ink:#4f5b4a; --muted:#8b9583;
    --up:#e06b6b; --down:#6f9a72; --flat:#9a9a8e; --accent:#6e915f;
    --shadow:0 4px 14px rgba(124,139,115,.12);
    /* 统一卡片/间距规范 */
    --card-radius:16px; --card-pad:12px; --gap:12px; --gap-sm:8px; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;overflow-wrap:break-word;word-break:break-word}
  button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
  a{color:var(--accent);text-decoration:none}
  .layout{display:flex;min-height:100vh}
  /* ===== Sidebar ===== */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:82px;background:var(--side);display:flex;flex-direction:column;
    align-items:center;padding:10px 0;overflow-y:auto;z-index:30;box-shadow:3px 0 14px rgba(255,79,139,.18)}
  .logo{width:48px;height:48px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(124,139,115,.25);margin-bottom:8px}
  .logo svg{width:36px;height:36px}
  .logo-txt{color:#fff;font-size:11px;font-weight:800;margin-top:-2px;margin-bottom:6px}
  .nav-item{width:72px;min-height:58px;padding:8px 2px;margin:3px 0;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;color:#fff;opacity:.88;transition:.18s;cursor:pointer;position:relative}
  .nav-item .ni{font-size:22px;line-height:1}
  .nav-item .nl{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;max-width:64px;overflow:hidden}
  .nav-item.active{background:#fff;color:var(--accent);opacity:1;transform:scale(1.03);box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:5px;height:26px;background:#fff;border-radius:0 6px 6px 0}
  .nav-item:active{transform:scale(.96)}
  /* ===== Main ===== */
  .main{margin-left:82px;padding:12px 12px 40px;width:100%;max-width:none}
  @media(min-width:720px){.main{margin-left:210px;max-width:1000px;margin-right:auto}}
  @media(min-width:720px){.sidebar{width:210px;align-items:stretch;padding:14px}
    .nav-item{flex-direction:row;justify-content:flex-start;align-items:center;width:auto;min-height:44px;padding:10px 12px;gap:10px;margin:4px 10px}
    .nav-item .ni{font-size:22px}.nav-item .nl{font-size:13.5px;max-width:none}}
  /* ===== Top pink header ===== */
  .topcard{background:linear-gradient(135deg,var(--head),#7c8b6f);border-radius:18px;padding:14px 14px 12px;margin-bottom:12px;color:#fff;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .topcard::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;background:rgba(255,255,255,.15);border-radius:50%}
  .tctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
  .tcicon{font-size:24px;background:rgba(255,255,255,.25);width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .tcinfo{flex:1}
  .tcname{font-size:18px;font-weight:900;letter-spacing:.5px}
  .tcsub{font-size:12px;opacity:.92;margin-top:2px}
  .tcdate{background:rgba(255,255,255,.25);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
  .tabs{display:flex;gap:10px;margin-top:10px}
  .tab{flex:1;background:rgba(255,255,255,.28);color:#fff;border-radius:20px;padding:8px 0;text-align:center;font-weight:700;font-size:14px}
  .tab.active{background:#fff;color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.08)}
  /* ===== Date line ===== */
  .dateline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 8px}
  /* ===== Cards ===== */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
  .card2{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:13px;margin-bottom:12px;box-shadow:var(--shadow)}
  .ch{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .ch .bow{font-size:16px}
  .drow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
  .drow:last-child{border-bottom:none;padding-bottom:0}
  .drow:first-child{padding-top:0}
  .dlabel{font-size:14px;color:var(--ink);font-weight:600}
  .dval{font-size:14px;font-weight:800}
  .mut{font-size:12px;font-weight:600;color:var(--muted)}
  .dlabel.sr-r{color:#ef4444}
  .dlabel.sr-s{color:#16a34a}
  .dlabel.sr-p{color:#d97706}
  .sr-badge{font-size:11px;font-weight:800;color:#fff;background:#d97706;padding:1px 7px;border-radius:10px;vertical-align:middle}
  #modalBox input[type=number]{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin-bottom:2px;background:#fff;color:var(--ink)}
  #modalBox .fld{font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:700}
  .bigprice{font-size:28px;font-weight:900;color:var(--accent)}
  .bigprice .unit{font-size:14px;font-weight:700;margin-left:2px}

<script>
/* =================== 基础工具 =================== */
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayStr(){return ymd(new Date());}
function addDays(str,n){const d=new Date(str+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function dayIndex(str){const d=new Date(str+'T00:00:00');return Math.floor(d.getTime()/86400000);}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function pick(arr,seed){return arr[Math.floor(rng(seed)()*arr.length)];}
function pickN(arr,seed,n){const r=rng(seed);const c=arr.slice();const out=[];while(out.length<n&&c.length){out.push(c.splice(Math.floor(r()*c.length),1)[0]);}return out;}
function fmtDateShort(str){const d=new Date(str+'T00:00:00');return (d.getMonth()+1)+'/'+d.getDate()+' 周'+'日一二三四五六'[d.getDay()];}
function fmtDateLong(str){const d=new Date(str+'T00:00:00');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
function fmtTime(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function vidLinks(kw){
  const e=encodeURIComponent(kw);
  return '<span class="vids">'+
    '<a class="vbtn v-dy" target="_blank" href="https://www.douyin.com/search/'+e+'">抖音</a>'+

    '<a class="vbtn v-xhs" target="_blank" href="https://www.xiaohongshu.com/search_result?keyword='+e+'">小红书</a></span>';
}
function vidLinks2(kw,platforms){
  const e=encodeURIComponent(kw),out=[];
  if(platforms.includes('dy'))out.push('<a class="vbtn v-dy" target="_blank" href="https://www.douyin.com/search/'+e+'">抖音</a>');
  if(platforms.includes('bz'))out.push('<a class="vbtn v-ks" target="_blank" href="https://search.bilibili.com/all?keyword='+e+'">B站</a>');

  return '<span class="vids">'+out.join('')+'</span>';
}
function kitty(color){

    '<circle cx="24" cy="9.5" r="2.4" fill="#6e915f"/>'+

}

/* =================== 存储 =================== */
const KEY='qiqi_workbench_v3';
let DB=JSON.parse(localStorage.getItem(KEY)||'{}');DB.prefs=DB.prefs||{};DB.userBooks=DB.userBooks||[];DB.goldSR=DB.goldSR||{};
function save(){localStorage.setItem(KEY,JSON.stringify(DB));}
function getDay(mod,date){DB[mod]=DB[mod]||{};if(!DB[mod][date])DB[mod][date]={gen:null,user:{},check:{},form:{}};return DB[mod][date];}
function setUser(mod,date,obj){const d=getDay(mod,date);d.user=Object.assign({},d.user,obj);save();}
function setCheck(mod,date,key,val){const d=getDay(mod,date);if(val)d.check[key]=1;else delete d.check[key];save();}
function setForm(mod,date,obj){const d=getDay(mod,date);d.form=Object.assign({},d.form,obj);save();}
const GEN_V=3;
function ensureGen(mod,date){const d=getDay(mod,date);if(!d.gen||d.gen._v!==GEN_V||(mod==='english'&&d.gen.bk!==englishBank())){d.gen=MODS[mod].gen(date);}save();return d.gen;}

let currentModule='home';
let currentDate=todayStr();
let currentTab='today';
let wxPending=false;   // 天气真实数据获取中
let wxError=false;     // 天气真实数据获取失败

/* =================== 实时行情 =================== */
const LIVE={gold:null,indices:null,core:null,last:0};
const IDX_CODES={
  '上证指数':{t:1,c:'000001'},'深证成指':{t:0,c:'399001'},'创业板指':{t:0,c:'399006'},
  '科创50':{t:1,c:'000688'},'沪深300':{t:1,c:'000300'}
};
function setLive(key,obj){LIVE[key]=obj;LIVE.last=Date.now();save();}
function loadSinaScript(codes,cb){
  const id='sinajs_'+Date.now();const s=document.createElement('script');s.id=id;
  s.src='https://hq.sinajs.cn/list='+codes.join(',');s.async=true;
  s.onload=()=>{setTimeout(cb,0);s.remove();};
  s.onerror=()=>{cb(new Error('load failed'));s.remove();};
  document.head.appendChild(s);
}
function fetchGold(cb){
  loadSinaScript(['hf_XAU','hf_GC'],(err)=>{
    if(err){cb(err);return;}
    try{
      const xau=window.hq_str_hf_XAU;const gc=window.hq_str_hf_GC;
      if(!xau){cb(new Error('empty xau'));return;}
      const px=xau.split(',');const pg=gc?gc.split(','):px;
      const spot=parseFloat(px[0]);const prev=parseFloat(px[8]||px[1]||spot);
      const comex=parseFloat(pg[0]||spot);const comexPrev=parseFloat(pg[8]||pg[1]||comex);
      const rate=0.217;const domestic=spot*rate;
      const change=spot-prev;const pct=prev?change/prev*100:0;
      const status=Math.abs(pct)<0.05?'持平':pct>0?'上涨':'下跌';
      const high=spot*1.01,low=spot*0.99;
      const sr=computeSR(spot,high,low);
      setLive('gold',{
        price:domestic.toFixed(2),buy:(domestic-2.5).toFixed(2),sell:(domestic+2).toFixed(2),
        status,change,pct,time:px[6]||new Date().toLocaleTimeString('zh-CN',{hour12:false}),spot:spot.toFixed(2)
      });
      setLive('core',{
        xau:spot.toFixed(2),range:(spot*0.99).toFixed(2)+' – '+(spot*1.01).toFixed(2)+' 美元',
        high:high.toFixed(2),low:low.toFixed(2),
        prev:prev.toFixed(2),open:(spot-(Math.random()*4-2)).toFixed(2),
        comex:comex.toFixed(2),comexPct:((comex-comexPrev)/comexPrev*100).toFixed(2),
        domestic:domestic.toFixed(2),domesticPct:pct.toFixed(2),
        sr:{P:sr.P.toFixed(2),R1:sr.R1.toFixed(2),S1:sr.S1.toFixed(2),R2:sr.R2.toFixed(2),S2:sr.S2.toFixed(2)}
      });
      cb();
    }catch(e){cb(e);}
  });
}
function fetchIndices(cb){
  if(typeof fetch!=='function'){cb(new Error('fetch not supported'));return;}
  const names=Object.keys(IDX_CODES);
  const urls=names.map(n=>{const k=IDX_CODES[n];return 'https://push2.eastmoney.com/api/qt/stock/get?secid='+k.t+'.'+k.c+'&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f107';});
  Promise.all(urls.map(u=>fetch(u).then(r=>r.json()).catch(e=>null))).then(res=>{
    const list=[];let ok=false;
    res.forEach((j,i)=>{if(j&&j.data){ok=true;const d=j.data;const cur=(d.f43||0)/100;const prev=(d.f60||0)/100;const ch=cur-prev;const pct=prev?ch/prev*100:0;list.push({name:names[i],price:cur.toFixed(2),change:ch.toFixed(2),pct:Number(pct.toFixed(2))});}});
    if(ok){setLive('indices',list);cb();}else{cb(new Error('no index data'));}
  });
}
function fetchAll(){
  if(typeof fetch!=='function'){useSampleGold();useSampleIndices();return;}
  fetchGold((err)=>{if(err){useSampleGold();}else{if(currentModule==='gold'&&currentTab==='today')render();}});
  fetchIndices((err)=>{if(err){useSampleIndices();}else{if(currentModule==='gold'&&currentTab==='today')render();}});
}
function computeSR(close,high,low){
  const P=(high+low+close)/3;
  return {P,R1:2*P-low,S1:2*P-high,R2:P+(high-low),S2:P-(high-low)};
}
function useSampleGold(){
  const spot=4052.70,prev=4035.00,domestic=879.50,comex=4028.80;
  const change=spot-prev,pct=change/prev*100;

  setLive('core',{xau:spot.toFixed(2),range:(spot*0.99).toFixed(2)+' – '+(spot*1.01).toFixed(2)+' 美元',high:high.toFixed(2),low:low.toFixed(2),prev:prev.toFixed(2),open:(spot-1.2).toFixed(2),comex:comex.toFixed(2),comexPct:'-1.18',domestic:domestic.toFixed(2),domesticPct:pct.toFixed(2),sr:{P:sr.P.toFixed(2),R1:sr.R1.toFixed(2),S1:sr.S1.toFixed(2),R2:sr.R2.toFixed(2),S2:sr.S2.toFixed(2)}});
}

    {name:'沪深300',price:'4509.15',change:'-90.86',pct:-1.98}
  ]);

/* =================== 数据池 =================== */
const BREAKFAST=[
  '牛奶燕麦碗 + 水煮蛋2个 + 鸡胸肉100g','无糖豆浆 + 全麦三明治(煎蛋+火腿) + 希腊酸奶',
  '小米南瓜粥 + 虾仁蒸蛋 + 奶酪1片','紫薯 + 牛肉蔬菜蛋卷 + 温牛奶',
  '杂粮饭团 + 卤牛肉 + 水煮蛋 + 酸奶','玉米 + 煎三文鱼 + 菠菜蛋汤 + 牛奶',
  '山药小米糊 + 蒸蛋羹 + 鸡腿肉 + 酸奶','燕麦牛奶杯 + 茶叶蛋 + 鸡胸肉沙拉'];
const MEAT=['番茄炒蛋','青椒炒肉丝','红烧排骨','宫保鸡丁','清蒸鲈鱼','土豆炖牛肉','香菇滑鸡','回锅肉','糖醋里脊','韭黄炒蛋'];
const HALF=['木须肉','虾仁蒸蛋','青椒土豆炒肉','肉末茄子','西兰花炒培根','胡萝卜炒肉片'];
const VEG=['蒜蓉西兰花','清炒时蔬','凉拌黄瓜','地三鲜','红烧茄子','家常豆腐','蚝油生菜','酸辣土豆丝','干煸四季豆','手撕包菜'];
const SOUP=['西红柿鸡蛋汤','紫菜蛋花汤','排骨玉米汤','冬瓜丸子汤','鲫鱼豆腐汤','莲藕排骨汤','菌菇鸡汤','萝卜牛腩汤'];
function comboMeal(seedKey){
  const s1=pick(MEAT,hashStr(seedKey+'m'));
  let s2=pick(HALF,hashStr(seedKey+'h'));if(s2===s1)s2=pick(HALF,hashStr(seedKey+'h2'));

/* 英语学习生成器：今日20新词 + 近7天复习 + 15天复习 + 错题复习 */
function englishBank(){return (DB.prefs&&DB.prefs.englishBank)||'cet4';}
function setEnglishBank(bk){DB.prefs=DB.prefs||{};DB.prefs.englishBank=bk;const d=getDay('english',currentDate);d.form.curIdx=0;save();}
function poolFor(date){const bk=englishBank();const pool=WORD_BANK[bk]||WORD_BANK.cet4;return {bk,pool};
}
function genEnglish(date){
  const s=dayIndex(date);
  const {bk,pool}=poolFor(date);
  const new20=pickN(pool,hashStr(date+bk+'new'),20).map((w,i)=>({...w,id:date+'-'+i,bk}));
  const review=[];
  // 近7天（不含今天）学过且未掌握的词
  for(let i=1;i<=7;i++){
    const d=addDays(date,-i);const day=getDay('english',d);
    if(day.form&&day.form.states){
      Object.entries(day.form.states).forEach(([k,st])=>{if(st!=='mastered'){const [dd,idx]=k.split('-');const g=DB.english&&DB.english[dd]&&DB.english[dd].gen;const w=g&&g.new20?g.new20[parseInt(idx)]:null;if(w)review.push({...w,id:k,source:d});}});
    }
  }
  // 15天前学过
  const d15=addDays(date,-15);const day15=getDay('english',d15);
  if(day15.form&&day15.form.states){
    Object.entries(day15.form.states).forEach(([k,st])=>{const [dd,idx]=k.split('-');const g=DB.english&&DB.english[dd]&&DB.english[dd].gen;const w=g&&g.new20?g.new20[parseInt(idx)]:null;if(w&&!review.find(x=>x.id===k))review.push({...w,id:k,source:d15});});
  }
  // 每7天重复错题
  if(s%7===0){
    Object.keys(DB.english||{}).forEach(d=>{
      const day=DB.english[d];if(day.form&&day.form.states){
        Object.entries(day.form.states).forEach(([k,st])=>{if(st==='wrong'){const [dd,idx]=k.split('-');const g=DB.english&&DB.english[dd]&&DB.english[dd].gen;const w=g&&g.new20?g.new20[parseInt(idx)]:null;if(w&&!review.find(x=>x.id===k))review.push({...w,id:k,source:d});}});
      }
    });
  }
  const nce=NCE_ALL[s%NCE_ALL.length];
  const dialog=DIALOGS[s%DIALOGS.length];
  const sceneDaily=PASSAGE_DAILY.slice(s%PASSAGE_DAILY.length,(s%PASSAGE_DAILY.length)+2).concat(PASSAGE_DAILY.slice(0,Math.max(0,2-(PASSAGE_DAILY.length-s%PASSAGE_DAILY.length)))).slice(0,2);
  const sceneWork=PASSAGE_WORK.slice(s%PASSAGE_WORK.length,(s%PASSAGE_WORK.length)+2).concat(PASSAGE_WORK.slice(0,Math.max(0,2-(PASSAGE_WORK.length-s%PASSAGE_WORK.length)))).slice(0,2);
  return {_v:GEN_V,bk,new20,review:uniqueWords(review),sceneDaily,sceneWork,nce,dialog,note:''};
}
function uniqueWords(arr){const seen=new Set();return arr.filter(w=>{if(seen.has(w.en+w.cn))return false;seen.add(w.en+w.cn);return true;});}

function genWeather(date){
  const city=(DB.prefs&&DB.prefs.weatherCity)||'浙江嘉善';
  const types=[{t:'晴',i:'☀️'},{t:'多云',i:'⛅'},{t:'小雨',i:'🌦️'},{t:'雨',i:'🌧️'},{t:'雷暴',i:'⛈️'}];
  const cityOffset={'浙江嘉善':1,'北京':-2,'上海':1,'广州':4,'深圳':4,'杭州':1,'成都':0};
  const base=23+(cityOffset[city]||0);
  const todayType=pick(types,hashStr(city+date+'tod'));
  const curHigh=Math.round(base+rng(hashStr(city+date+'h'))()*4-1);
  const curLow=Math.round(curHigh-3-rng(hashStr(city+date+'l'))()*3);
  const curTemp=Math.round((curHigh+curLow)/2);
  const forecast=[];
  for(let i=0;i<7;i++){
    const d=addDays(date,i);
    const tp=pick(types,hashStr(city+d+'f'));
    const hi=Math.round(base+rng(hashStr(city+d+'hi'))()*5-1);
    const lo=Math.round(hi-3-rng(hashStr(city+d+'lo'))()*3);
    const label=i===0?'今天':i===1?'明天':(parseInt(d.slice(5,7))+'/'+parseInt(d.slice(8,10)));
    forecast.push({label,type:tp.t,icon:tp.i,high:hi,low:lo});

/* —— 真实天气（Open-Meteo，免费、无需密钥、支持浏览器跨域）—— */
const WEATHER_COORDS={
  '浙江嘉善':[30.844,120.914],'北京':[39.9042,116.4074],'上海':[31.2304,121.4737],
  '广州':[23.1291,113.2644],'深圳':[22.5431,114.0579],'杭州':[30.2741,120.1551],'成都':[30.5728,104.0668]
};
function wmoInfo(code){
  const m={
    0:['晴','☀️'],1:['晴间多云','🌤️'],2:['多云','⛅'],3:['阴','☁️'],
    45:['雾','🌫️'],48:['雾凇','🌫️'],
    51:['毛毛雨','🌦️'],53:['毛毛雨','🌦️'],55:['毛毛雨','🌦️'],
    56:['冻雨','🌧️'],57:['冻雨','🌧️'],
    61:['小雨','🌧️'],63:['中雨','🌧️'],65:['大雨','🌧️'],
    66:['冻雨','🌧️'],67:['冻雨','🌧️'],
    71:['小雪','❄️'],73:['中雪','❄️'],75:['大雪','❄️'],77:['雪粒','❄️'],
    80:['阵雨','🌦️'],81:['阵雨','🌦️'],82:['强阵雨','🌧️'],
    85:['阵雪','❄️'],86:['阵雪','❄️'],
    95:['雷阵雨','⛈️'],96:['雷阵雨','⛈️'],99:['雷暴冰雹','⛈️']
  };
  const r=m[code]||['未知','🌡️'];return {t:r[0],i:r[1]};
}
function weatherSuggest(temp,code){
  const rain=[61,63,65,66,67,80,81,82,95,96,99].indexOf(code)>=0;
  const snow=[71,73,75,77,85,86].indexOf(code)>=0;
  let outfit,diet;
  if(snow){outfit='❄️ 有降雪，注意保暖防滑，羽绒服+雪地靴更稳妥';}
  else if(rain){outfit='🌧️ 有降水，记得带伞，鞋子选防水的';}
  else if(temp>=30){outfit='☀️ 炎热，轻薄透气为主，注意防晒补水';}
  else if(temp>=22){outfit='🌤️ 温暖舒适，短袖或薄长袖都合适';}
  else if(temp>=15){outfit='🧥 微凉，建议长袖+薄外套叠穿';}
  else if(temp>=5){outfit='🧣 偏冷，加厚外套+围巾更稳妥';}
  else{outfit='🧤 寒冷，羽绒服/厚大衣保暖必备';}
  if(rain){diet='🍲 雨天湿气重，姜茶/热粥祛寒暖身';}
  else if(snow||temp<=5){diet='🍲 寒冷天气，温补羊肉汤/火锅驱寒';}
  else if(temp>=30){diet='🍉 炎热天气，多吃瓜果补水，适量冷饮消暑';}
  else{diet='🥗 宜清淡均衡，多吃蔬果补充维生素C';}
  return {outfit,diet};
}
async function fetchWeather(city,date){
  if(typeof fetch!=='function')return;
  try{
    let coord=WEATHER_COORDS[city];
    if(!coord){
      const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh&format=json').then(r=>r.json());
      if(g.results&&g.results[0])coord=[g.results[0].latitude,g.results[0].longitude];
    }
    if(!coord)return;
    const url='https://api.open-meteo.com/v1/forecast?latitude='+coord[0]+'&longitude='+coord[1]+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'+
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m'+
      '&timezone=Asia%2FShanghai&forecast_days=7';
    const data=await fetch(url).then(r=>r.json());
    if(!data||!data.daily||!data.daily.time)return;
    const cur=data.current;const curCode=cur.weather_code;const ci=wmoInfo(curCode);
    const curTemp=Math.round(cur.temperature_2m);
    const daily=data.daily;const fc=[];
    for(let i=0;i<7&&i<daily.time.length;i++){
      const c=wmoInfo(daily.weather_code[i]);
      const label=i===0?'今天':i===1?'明天':daily.time[i].slice(5).replace('-','/');
      fc.push({label,type:c.t,icon:c.i,high:Math.round(daily.temperature_2m_max[i]),low:Math.round(daily.temperature_2m_min[i]),pop:daily.precipitation_probability_max[i]});
    }
    const sug=weatherSuggest(curTemp,curCode);
    const real={_v:GEN_V,city,real:true,realDate:date,realTime:Date.now(),todayType:ci.t,todayIcon:ci.i,curTemp,curHigh:fc[0].high,curLow:fc[0].low,
      humidity:Math.round(cur.relative_humidity_2m),wind:Math.round(cur.wind_speed_10m),forecast:fc,outfit:sug.outfit,diet:sug.diet};
    const d=getDay('weather',date);d.gen=real;save();
    wxPending=false;wxError=false;
    if(currentModule==='weather'&&currentDate===date)render();
  }catch(e){wxPending=false;wxError=true;if(currentModule==='weather'&&currentDate===date)render();/* 离线/被拦截，保留种子示例数据 */}
}
function loadWeatherReal(){
  if(typeof fetch!=='function'){wxError=true;wxPending=false;return;}
  const g=getDay('weather',currentDate).gen;
  // 已有「当天」真实数据则不必重拉；否则（无数据/旧缓存/示例）重新获取
  if(g&&g.real&&g.realDate===currentDate){wxPending=false;wxError=false;return;}
  wxPending=true;wxError=false;
  fetchWeather(g?g.city:'浙江嘉善',currentDate);
}

function totalBookMinutes(){
  let m=0;Object.values(DB.books||{}).forEach(d=>{if(d.form&&d.form.minutes)m+=+d.form.minutes;});return m;
}
function bookStreak(date){
  let cnt=0,cur=date;
  while(true){const d=DB.books&&DB.books[cur];if(d&&d.form&&d.form.minutes>=30){cnt++;cur=addDays(cur,-1);}else break;}
  return cnt;
}

  y=y||new Date().getFullYear();

}

    });

}

/* =================== 每日计划 =================== */
function planStreak(date){
  let cnt=0;let cur=date;
  while(true){const d=DB.plan&&DB.plan[cur];const tasks=(d&&d.form&&d.form.tasks)||[];const ok=tasks.length>0&&tasks.every(t=>t.done);
    if(ok){cnt++;cur=addDays(cur,-1);}else break;}
  return cnt;
}
function viewPlan(){
  const wrap=document.getElementById('view');wrap.innerHTML='';renderDateLine();
  const d=getDay('plan',currentDate);const tasks=(d.form.tasks||[]).slice();
  const done=tasks.filter(t=>t.done).length;
  const rate=tasks.length?Math.round(done/tasks.length*100):0;
  const now=new Date();const greet=(now.getHours()<6?'凌晨好':now.getHours()<12?'早上好':now.getHours()<14?'中午好':now.getHours()<18?'下午好':now.getHours()<22?'晚上好':'夜深了');
  const md=new Date(currentDate+'T00:00:00');const wk='日一二三四五六'[md.getDay()];
  let html='<div class="plan-top"><div class="pt-greet">'+(md.getMonth()+1)+'月'+md.getDate()+'日 · 周'+wk+' · '+greet+'</div><div class="pt-sub">用计划点亮每一天 ✨</div></div>';
  html+='<div class="plan-stats"><div class="plan-stat"><div class="psv">'+tasks.length+'</div><div class="psl">今日任务</div></div>'+
    '<div class="plan-stat"><div class="psv">'+done+'</div><div class="psl">已完成</div></div>'+
    '<div class="plan-stat"><div class="psv">'+rate+'%</div><div class="psl">完成率</div></div>'+
    '<div class="plan-stat"><div class="psv">'+planStreak(currentDate)+'</div><div class="psl">连续打卡</div></div></div>';
  html+='<div class="plan-date"><button class="pd-btn" data-act="date-prev">← 前一天</button><div class="pd-mid">'+fmtDateLong(currentDate)+'</div><button class="pd-btn" data-act="date-next">后一天 →</button></div>';
  if(!tasks.length){html+='<div class="plan-empty">还没有任务，点击右下角 ➕ 添加今日计划吧～</div>';}
  else{
    tasks.forEach((t,i)=>{
      html+='<div class="plan-task'+(t.done?' done':'')+'">'+
        '<input type="checkbox" class="chk" data-mod="plan" data-date="'+currentDate+'" data-key="task-'+i+'" '+(t.done?'checked':'')+'>'+
        '<div class="pt-main"><div class="pt-title">'+esc(t.title)+'</div><div class="pt-meta">'+
          (t.time?'🕒 '+esc(t.time)+(t.dur?' · '+esc(t.dur):''):'')+
          ' <span class="tag-cat cat-'+t.cat+'">'+t.cat+'</span>'+
          ' <span class="tag-pri pri-'+t.pri+'">'+t.pri+'</span>'+
          (t.note?'<div style="width:100%">📝 '+esc(t.note)+'</div>':'')+
        '</div></div>'+
        '<div class="pt-ops"><span data-act="plan-edit" data-i="'+i+'">✏️</span><span data-act="plan-del" data-i="'+i+'">🗑️</span></div></div>';
    });
  }
  wrap.innerHTML=html;
  let fab=document.getElementById('planFab');
  if(!fab){fab=document.createElement('div');fab.id='planFab';fab.className='plan-fab';fab.innerHTML='➕';document.body.appendChild(fab);}
  fab.onclick=()=>openPlanModal(-1);
}
function bindPlan(){
  document.querySelectorAll('[data-act="plan-edit"]').forEach(b=>b.addEventListener('click',()=>planEdit(parseInt(b.dataset.i))));
  document.querySelectorAll('[data-act="plan-del"]').forEach(b=>b.addEventListener('click',()=>planDel(parseInt(b.dataset.i))));
}
function openPlanModal(idx){
  const d=getDay('plan',currentDate);const tasks=d.form.tasks||[];
  const t=idx>=0?tasks[idx]:null;
  const catOpts=['健康','学习','效率','工作'].map(c=>'<option value="'+c+'"'+(t&&t.cat===c?' selected':'')+'>'+c+'</option>').join('');
  const priOpts=['低','中','高'].map(p=>'<option value="'+p+'"'+(t&&t.pri===p?' selected':'')+'>'+p+'</option>').join('');
  showModal('<h3>'+(idx>=0?'编辑任务':'新增任务')+'</h3>'+
    '<label class="fld">标题</label><input id="pm-title" value="'+esc(t?t.title:'')+'" placeholder="例如：晨跑30分钟">'+
    '<label class="fld">时间</label><input id="pm-time" value="'+esc(t?t.time:'')+'" placeholder="09:00">'+
    '<label class="fld">时长</label><input id="pm-dur" value="'+esc(t?t.dur:'')+'" placeholder="30分钟">'+
    '<label class="fld">分类</label><select id="pm-cat">'+catOpts+'</select>'+
    '<label class="fld">优先级</label><select id="pm-pri">'+priOpts+'</select>'+
    '<label class="fld">备注</label><input id="pm-note" value="'+esc(t?t.note:'')+'" placeholder="选填">'+
    '<div class="btn-row"><button class="btn ghost" data-act="close-modal">取消</button><button class="btn" id="pm-save">保存</button></div>');
  document.getElementById('pm-save').onclick=()=>{
    const nd={title:document.getElementById('pm-title').value.trim()||'未命名任务',time:document.getElementById('pm-time').value,dur:document.getElementById('pm-dur').value,cat:document.getElementById('pm-cat').value,pri:document.getElementById('pm-pri').value,note:document.getElementById('pm-note').value,done:t?t.done:false};
    const dd=getDay('plan',currentDate);dd.form.tasks=dd.form.tasks||[];
    if(idx>=0)dd.form.tasks[idx]=nd;else dd.form.tasks.push(nd);
    save();closeModal();render();
  };
}
function planEdit(i){openPlanModal(i);}
function planDel(i){const d=getDay('plan',currentDate);d.form.tasks=d.form.tasks||[];d.form.tasks.splice(i,1);save();render();}

/* =================== 通用辅助 =================== */
function speakText(text,lang){
  if(!window.speechSynthesis){toast('当前浏览器不支持朗读');return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||'en-US';u.rate=0.95;
  window.speechSynthesis.speak(u);
}
function copyText(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>fallbackCopy(text));}
  else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败');}
  ta.remove();
}
function toggleFav(coll,obj){
  DB.favorites=DB.favorites||{};DB.favorites[coll]=DB.favorites[coll]||[];
  const i=DB.favorites[coll].findIndex(f=>f.id===obj.id);
  if(i>=0)DB.favorites[coll].splice(i,1);else DB.favorites[coll].push(obj);
  save();
}
function openFavModal(coll){
  const arr=(DB.favorites&&DB.favorites[coll])||[];
  let html='<h3>❤️ 收藏夹</h3>';
  if(!arr.length)html+='<div class="note">还没有收藏内容～</div>';
  else{html+='<div class="history-list">'+arr.map(f=>'<div class="hist-item" data-act="fav-del" data-coll="'+coll+'" data-id="'+esc(f.id)+'"><span class="hd">'+esc(f.title)+'</span><span class="hb">删除 ›</span></div>').join('')+'</div>';}
  html+='<div class="btn-row"><button class="btn ghost" data-act="close-modal">关闭</button></div>';
  showModal(html);
}

/* =================== 朗读 & 录音 =================== */
function speakWord(text){
  if(!window.speechSynthesis){toast('当前浏览器不支持朗读');return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.9;
  window.speechSynthesis.speak(u);
}
const REC={};
function recordWord(id,text,btn){
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('当前浏览器不支持录音');return;}
  const box=document.getElementById('rec-'+id);
  if(REC[id]==='recording'){REC.recorder.stop();REC[id]='idle';btn.textContent='🎤 录音对比';return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const mr=new MediaRecorder(stream);
    const chunks=[];mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      const url=URL.createObjectURL(blob);
      box.innerHTML='<audio controls src="'+url+'" style="width:100%"></audio><div class="note">点击播放，对比原声与自己的发音</div>';
      box.style.display='block';
      btn.textContent='🎤 录音对比';
    };
    REC.recorder=mr;REC[id]='recording';
    mr.start();btn.textContent='⏹ 停止录音';
  }).catch(e=>{toast('无法使用麦克风：'+e.message);});
}

/* =================== 历史 =================== */
function renderHistory(mod){
  const wrap=document.getElementById('view');wrap.innerHTML='';
  const days=Object.keys(DB[mod]||{}).filter(d=>DB[mod][d].gen||Object.keys(DB[mod][d].user).length||Object.keys(DB[mod][d].form).length).sort().reverse();
  let html='<div class="card"><div class="ch">📚 历史记录 · '+MODS[mod].name+'</div>';
  if(!days.length){html+='<div class="note">暂无历史数据</div>';}
  else{html+='<div class="history-list">';days.forEach(dt=>{const d=DB[mod][dt];let badge='';
    if(mod==='account')badge='支出'+(d.form.items?d.form.items.reduce((a,b)=>a+b.amt,0):0)+'元';
    else if(mod==='skincare')badge='打卡'+Object.keys(d.check).length+'项';
    else if(mod==='english')badge=(d.check.practiced?'已学':'未学')+' · 词'+Object.keys(d.form.states||{}).length;
    else if(mod==='express')badge=d.check.practiced?'已练习':'未练习';
    else if(mod==='hot')badge=(d.gen?HOT_CATS.map(c=>d.gen.items[c].length).reduce((a,b)=>a+b,0):0)+'条热点';
    else if(mod==='books')badge=(d.form.minutes||0)+'分钟';
    else badge='有记录';
    html+='<div class="hist-item" data-act="jump" data-date="'+dt+'"><span class="hd">'+dt+'</span><span class="hb">'+badge+' ›</span></div>';});
    html+='</div>';}
  html+='</div>';wrap.innerHTML=html;
}

/* =================== 通用工具 =================== */
function streakOf(mod,date,key){
  let cnt=0;let cur=date;
  while(true){const d=DB[mod]&&DB[mod][cur];if(d&&(key==='day'?Object.keys(d.check).length>0:d.check[key])){cnt++;cur=addDays(cur,-1);}else break;}
  return cnt;
}
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modalMask').classList.add('show');}
function closeModal(){document.getElementById('modalMask').classList.remove('show');}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#6e3b52;color:#fff;padding:9px 18px;border-radius:20px;z-index:99;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',1400);}
function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qiqi-backup-'+todayStr()+'.json';a.click();toast('已导出');}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);DB=Object.assign(DB,o);save();toast('导入成功');render();}catch(err){toast('文件格式错误');}};r.readAsText(f);};inp.click();}

/* =================== 事件 / 路由 =================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='nav'){currentModule=el.dataset.mod;currentDate=todayStr();currentTab='today';closeModal();render();}
  else if(act==='tab'){currentTab=el.dataset.tab;render();}
  else if(act==='date-prev'){currentDate=addDays(currentDate,-1);render();}
  else if(act==='date-next'){if(currentDate<todayStr()){currentDate=addDays(currentDate,1);render();}}
  else if(act==='today'){currentDate=todayStr();render();}
  else if(act==='jump'){currentDate=el.dataset.date;currentTab='today';closeModal();render();}
  else if(act==='close-modal'){closeModal();}
  else if(act==='vid'){const kw=decodeURIComponent(el.dataset.kw);window.open('https://www.douyin.com/search/'+encodeURIComponent(kw),'_blank');window.open('https://www.kuaishou.com/search/video?searchKey='+encodeURIComponent(kw),'_blank');}
  else if(act==='export'){exportData();}
  else if(act==='import'){importData();}
  else if(act==='exp-cat'){DB.prefs=DB.prefs||{};DB.prefs.expTab=el.dataset.tab;render();}
  else if(act==='beauty-cat'){DB.prefs=DB.prefs||{};DB.prefs.beautyCat=el.dataset.cat;render();}
  else if(act==='fav-del'){const coll=el.dataset.coll;const id=el.dataset.id;DB.favorites=DB.favorites||{};DB.favorites[coll]=(DB.favorites[coll]||[]).filter(f=>f.id!==id);save();render();}
  else if(act==='book-add-user'){openBookModal();}
  else if(act==='book-save-user'){
    const title=document.getElementById('bk-title').value.trim();
    const author=document.getElementById('bk-author').value.trim()||'佚名';
    const cat=document.getElementById('bk-cat').value;
    const why=document.getElementById('bk-why').value.trim();
    const status=document.getElementById('bk-status').value||'想读';
    if(!title){toast('请填写书名');return;}
    const emojiMap={'孕期':'🤰','育儿':'👶','成长':'🌱','商业':'💼','文学':'📖','历史':'🏛️','社科':'🌍','心理':'🧠','财商':'💰','沟通':'🗣️','效率':'⚡','其他':'📚'};
    DB.userBooks=DB.userBooks||[];
    const nb={title:'《'+title.replace(/^《|》$/g,'')+'》',author,cat,emoji:emojiMap[cat]||'📚',source:'我的书架',why:why||'自己添加的书，值得一读。',status,user:true};
    if(status==='已读')nb.readAt=Date.now();
    DB.userBooks.push(nb);
    save();closeModal();toast('已加入书架');render();
  }
  else if(act==='book-status'){
    const i=parseInt(el.dataset.i);DB.userBooks=DB.userBooks||[];
    if(i>=0&&i<DB.userBooks.length){
      const order=['想读','在读','已读'];
      const cur=DB.userBooks[i].status||'想读';
      const nxt=order[(order.indexOf(cur)+1)%order.length];
      DB.userBooks[i].status=nxt;
      if(nxt==='已读')DB.userBooks[i].readAt=Date.now();
      save();render();
    }
  }
  else if(act==='book-del-user'){
    const i=parseInt(el.dataset.i);DB.userBooks=DB.userBooks||[];
    if(i>=0&&i<DB.userBooks.length){DB.userBooks.splice(i,1);save();render();}
  }
  else if(act==='wx-refresh'){const d=getDay('weather',currentDate);d.gen=null;save();render();}
  else if(act==='sr-edit'){openSrModal();}
  else if(act==='sr-save'){
    const keys=['R2','R1','P','S1','S2'];
    const vals={};let bad=false;
    keys.forEach(k=>{const raw=document.getElementById('sr-'+k.toLowerCase())?.value.trim();const n=parseFloat(raw);if(raw===''||isNaN(n)){bad=true;}else vals[k]=n;});
    if(bad){toast('请填写全部 5 个有效数值');return;}
    DB.goldSR=DB.goldSR||{};
    DB.goldSR[currentDate]={P:vals.P,R1:vals.R1,S1:vals.S1,R2:vals.R2,S2:vals.S2,at:Date.now()};
    save();closeModal();toast('已保存手动价位');render();
  }
  else if(act==='sr-reset'){
    if(DB.goldSR&&DB.goldSR[currentDate]){delete DB.goldSR[currentDate];save();render();toast('已恢复推算值');}
  }
});
document.addEventListener('change',e=>{
  const c=e.target.closest('.chk');if(!c)return;
  if(c.dataset.mod==='plan'){
    const i=parseInt((c.dataset.key||'').replace('task-',''));
    const d=getDay('plan',c.dataset.date);d.form.tasks=d.form.tasks||[];
    if(d.form.tasks[i]){d.form.tasks[i].done=c.checked;save();render();}
    return;
  }
  setCheck(c.dataset.mod,c.dataset.date,c.dataset.key,c.checked);
  render();
});

function render(){
  buildSidebar();renderTop();
  if(currentModule!=='plan'){const pf=document.getElementById('planFab');if(pf)pf.remove();}
  if(currentModule==='home'){renderHome();}
  else{const m=MODS[currentModule];ensureGen(currentModule,currentDate);
    if(currentTab==='history'){renderHistory(currentModule);}
    else{m.view();if(m.bind)m.bind();}
  }
}

/* =================== 启动 =================== */
if(!LIVE.gold)fetchAll();
setInterval(fetchAll,60000);
render();
